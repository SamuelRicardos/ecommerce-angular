<mat-toolbar color="primary" class="header">
  <button mat-icon-button class="menu-button" [matMenuTriggerFor]="menuMobile">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="logo">
    <mat-icon class="logo-icon">storefront</mat-icon>
    ShopPrime
  </span>

  <mat-menu #menuMobile="matMenu">
    <button mat-menu-item *ngFor="let c of categorias" (click)="filtrarPorCategoria(c)">
      {{ c }}
    </button>
    <button mat-menu-item (click)="limparFiltro.emit()">Produtos</button>
    <mat-divider></mat-divider>
    <button mat-menu-item>
      <mat-icon>search</mat-icon>
      <span>Pesquisar</span>
    </button>
    <button mat-menu-item [routerLink]="'/cart'">
      <mat-icon>shopping_cart</mat-icon>
      <span>Carrinho</span>
    </button>
    <button mat-menu-item (click)="irParaLogin.emit()">
      <mat-icon>login</mat-icon>
      <span>Login</span>
    </button>
  </mat-menu>

  <div class="nav-links">
    <mat-menu #categoriasMenu="matMenu">
      <button mat-menu-item *ngFor="let c of categorias" (click)="filtrarPorCategoria(c)">
        {{ c }}
      </button>
    </mat-menu>

    <a class="nav-item" [matMenuTriggerFor]="categoriasMenu">Categorias</a>
    <a class="nav-item">Mais vendidos</a>
    <a class="nav-item">Novidades</a>
    <a class="nav-item" (click)="limparFiltro.emit()">Produtos</a>
  </div>

  <span class="spacer"></span>

  <mat-form-field appearance="outline" class="search-field">
    <mat-icon matPrefix>search</mat-icon>
    <input matInput placeholder="Pesquisar produtos" [(ngModel)]="searchTerm" (input)="onSearchChange()" />
    <button mat-icon-button matSuffix *ngIf="searchTerm" (click)="clearSearch()">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>

  <button mat-icon-button class="icon-button" [routerLink]="'/cart'">
    <mat-icon matBadge="{{ cartCount }}" matBadgeColor="warn" matBadgeHidden="{{ cartCount === 0 }}">
      shopping_cart
    </mat-icon>
  </button>

  <ng-container *ngIf="nomeUsuario; else loginButton">
    <button mat-icon-button [matTooltip]="nomeUsuario">
      <mat-icon>account_circle</mat-icon>
    </button>

    <button mat-stroked-button color="warn" (click)="sair()">
      Sair
    </button>
  </ng-container>

  <!-- Se não estiver logado, mostra botão de login -->
  <ng-template #loginButton>
    <button mat-stroked-button color="primary" (click)="irParaLogin.emit()">
      Login
    </button>
  </ng-template>
</mat-toolbar>
